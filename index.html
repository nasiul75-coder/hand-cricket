<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hand Cricket Pro - Ultimate Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Teko:wght@500;700&family=Inter:wght@400;700;900&display=swap');
        body { 
            font-family: 'Inter', sans-serif; background-color: #020617; color: #f8fafc; margin: 0; min-height: 100vh; overflow-x: hidden; 
            background-image: linear-gradient(to bottom, rgba(2, 6, 23, 0.95), rgba(2, 6, 23, 0.98)), url('https://images.unsplash.com/photo-1540747913346-19e32dc3e97e?q=80&w=2000'); 
            background-size: cover; background-position: center; background-attachment: fixed;
        }
        .glass { background: rgba(10, 20, 40, 0.85); backdrop-filter: blur(16px); border: 1px solid rgba(255, 215, 0, 0.1); box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        .input-glass { background: rgba(0,0,0,0.8); border: 1px solid rgba(255,255,255,0.2); color: white; outline: none; transition: 0.3s; }
        .input-glass:focus { border-color: #ffd700; box-shadow: 0 0 15px rgba(255, 215, 0, 0.3); }
        .screen { display: none; width: 100%; min-height: calc(100vh - 64px); flex-direction: column; padding-bottom: 2rem; overflow-y: auto;}
        .active-screen { display: flex; }
        .btn-move { transition: transform 0.1s; } .btn-move:active { transform: scale(0.9); }
        .selected-move { border-color: #ffd700 !important; box-shadow: 0 0 20px rgba(255,215,0,0.4); background: rgba(255,215,0,0.15) !important; color: white !important;}
        #bowler-modal { z-index: 999999 !important; }
        .score-font { font-family: 'Teko', sans-serif; letter-spacing: 1px; line-height: 0.9; }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
    </style>
    
    <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-database-compat.js"></script>
</head>
<body>

    <audio id="sfx-click" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3" preload="auto"></audio>
    <audio id="sfx-0" src="https://assets.mixkit.co/active_storage/sfx/2572/2572-preview.mp3" preload="auto"></audio>
    <audio id="sfx-1" src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3" preload="auto"></audio>
    <audio id="sfx-2" src="https://assets.mixkit.co/active_storage/sfx/2003/2003-preview.mp3" preload="auto"></audio>
    <audio id="sfx-4" src="https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3" preload="auto"></audio>
    <audio id="sfx-6" src="https://assets.mixkit.co/active_storage/sfx/1995/1995-preview.mp3" preload="auto"></audio>
    <audio id="sfx-w" src="https://assets.mixkit.co/active_storage/sfx/3180/3180-preview.mp3" preload="auto"></audio>

    <header class="w-full h-16 px-4 flex justify-between items-center bg-[#050b14] border-b border-[#ffd700]/20 z-50 sticky top-0 shadow-lg">
        <div class="flex items-center gap-2 cursor-pointer" onclick="nav('dashboard')">
            <i class="fa-solid fa-trophy text-[#ffd700] text-2xl"></i><h1 class="text-xl font-black uppercase tracking-widest text-[#ffd700]">HC <span class="text-white">Pro</span></h1>
        </div>
        <div class="flex items-center gap-3">
            <span id="nav-user" class="text-sm font-bold uppercase text-slate-300">Player</span>
            <button onclick="auth.signOut()" class="text-red-500 hover:text-red-400 text-lg ml-2"><i class="fa-solid fa-power-off"></i></button>
        </div>
    </header>

    <!-- LOGIN -->
    <div id="login" class="screen items-center justify-center p-4">
        <div class="glass w-full max-w-md p-10 rounded-[2rem] text-center border-t-2 border-[#ffd700]">
            <h1 class="text-5xl font-black mb-8 uppercase text-transparent bg-clip-text bg-gradient-to-r from-[#ffd700] to-yellow-300 score-font">Log In</h1>
            <button onclick="login()" class="w-full bg-white text-black py-4 rounded-xl font-black text-lg flex justify-center items-center gap-3 shadow-xl">Continue with Google</button>
        </div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard" class="screen p-4 max-w-5xl mx-auto w-full pt-6">
        <div class="flex flex-col md:flex-row gap-3 bg-black/60 p-4 rounded-2xl border border-white/10 mb-6 shadow-lg">
            <input type="text" id="join-input" placeholder="ENTER ROOM CODE TO JOIN" class="input-glass flex-1 p-4 rounded-xl font-mono font-bold uppercase text-center md:text-left text-lg">
            <button onclick="joinAction(); playSound('click')" class="bg-blue-600 hover:bg-blue-500 py-4 px-10 rounded-xl font-black uppercase text-lg text-white">JOIN GAME</button>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <button onclick="prepSetup('match'); playSound('click')" class="glass p-8 rounded-[2rem] text-left hover:border-blue-500 transition border-t-4 border-blue-600">
                <h2 class="font-black text-3xl uppercase">Create Match</h2>
                <p class="text-sm font-bold text-slate-400 mt-2">1v1 Real Cricket Engine</p>
            </button>
        </div>
    </div>

    <!-- SQUAD BUILDER -->
    <div id="squad-builder" class="screen p-4 max-w-3xl mx-auto w-full pt-6">
        <h2 class="text-2xl font-black uppercase text-white mb-4">Verify Playing 11</h2>
        <div class="glass p-6 sm:p-8 rounded-[2rem]">
            <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest block mb-2">Team Name</label>
            <input type="text" id="team-name" value="India" class="input-glass w-full p-4 rounded-xl font-black text-lg uppercase mb-6 text-[#ffd700]">
            <div id="player-inputs" class="grid grid-cols-1 sm:grid-cols-2 gap-3"></div>
            <button onclick="saveSquadAndProceed(); playSound('click')" class="w-full bg-blue-600 py-4 rounded-xl font-black uppercase text-xl mt-6">Confirm Squad</button>
        </div>
    </div>

    <!-- CONFIG -->
    <div id="match-config" class="screen p-4 max-w-xl mx-auto w-full pt-8">
        <div class="glass p-8 rounded-[2rem] border-t-4 border-blue-600">
            <h2 class="text-3xl font-black uppercase mb-6 text-blue-400 text-center">Match Rules</h2>
            <div class="space-y-4">
                <div><label class="text-xs font-black text-slate-400 uppercase">Your Choice</label>
                    <select id="m-role" class="input-glass w-full p-3 rounded-lg font-black text-[#ffd700]">
                        <option value="bat">BAT FIRST</option>
                        <option value="bowl">BOWL FIRST</option>
                    </select>
                </div>
                <div><label class="text-xs font-black text-slate-400 uppercase">Overs</label>
                    <select id="m-overs" class="input-glass w-full p-3 rounded-lg font-bold"><option value="1">1 Over</option><option value="5" selected>5 Overs</option><option value="10">10 Overs</option></select>
                </div>
                <div><label class="text-xs font-black text-slate-400 uppercase">Wickets</label><select id="m-wickets" class="input-glass w-full p-3 rounded-lg font-bold"><option value="1">1 Wicket</option><option value="10" selected>10 Wickets</option></select></div>
            </div>
            <button onclick="hostMatch(); playSound('click')" class="w-full bg-emerald-600 py-4 rounded-xl font-black text-lg mt-6 uppercase">Start Match Now</button>
        </div>
    </div>

    <!-- LOBBY -->
    <div id="lobby" class="screen p-4 max-w-5xl mx-auto w-full pt-8">
        <div class="glass p-8 rounded-[2rem] text-center border-t-2 border-emerald-500 mb-6 bg-black/80">
            <p class="text-emerald-400 font-black uppercase text-sm mb-2">Share Room Code</p>
            <div class="text-5xl md:text-7xl font-mono font-black text-white bg-black/60 p-4 rounded-2xl inline-block tracking-widest score-font" id="lobby-code">----</div>
            <p id="lobby-status" class="text-yellow-400 font-bold mt-4 uppercase animate-pulse">Waiting for opponent to join...</p>
        </div>
    </div>

    <!-- ARENA -->
    <div id="arena" class="screen p-2 max-w-5xl mx-auto w-full pt-4 h-full">
        <div class="glass border-b-4 border-[#ffd700] rounded-t-2xl p-4 sm:p-6 mb-3 flex justify-between items-center bg-black">
            <div class="w-1/3 text-left">
                <div class="text-[10px] text-slate-400 font-bold uppercase mb-1" id="ui-bat-team">BAT TEAM</div>
                <div class="text-4xl sm:text-6xl font-black text-white score-font" id="ui-score">0<span class="text-xl text-slate-400">/0</span></div>
            </div>
            <div class="w-1/3 text-center px-1">
                <div class="text-black font-black text-[10px] uppercase bg-[#ffd700] px-3 py-1 rounded mb-2 inline-block">Innings <span id="ui-inn">1</span></div>
                <div class="text-base sm:text-xl font-black text-white uppercase score-font">OVERS: <span id="ui-overs" class="text-blue-400">0.0</span></div>
            </div>
            <div class="w-1/3 text-right">
                <div class="text-[10px] text-slate-400 font-bold uppercase mb-1" id="ui-bowl-team">BOWL TEAM</div>
                <div class="text-xs font-black text-slate-400 uppercase mt-2">Target: <span class="text-[#ffd700] text-xl" id="ui-target">--</span></div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-3 mb-3">
            <div class="glass p-4 rounded-xl border-l-4 border-blue-500 bg-[#050b14]/80">
                <div class="flex justify-between text-[10px] uppercase text-slate-500 font-black mb-2 px-1"><span>Batters</span><span>R(B)</span></div>
                <div class="flex justify-between items-center mb-2 bg-blue-900/40 p-2 rounded-lg border border-blue-500/40">
                    <div class="font-black text-white text-sm" id="ui-s-name">Striker</div>
                    <div class="font-black text-white text-sm" id="ui-s-score">0(0)</div>
                </div>
            </div>
            <div class="glass p-4 rounded-xl border-l-4 border-red-500 bg-[#050b14]/80 flex flex-col justify-between">
                <div class="bg-black/80 p-2 rounded border border-white/5">
                    <div class="text-[10px] text-[#ffd700] font-black uppercase mb-1">Live Commentary</div>
                    <div class="h-16 overflow-y-auto custom-scroll font-mono text-[10px] text-slate-300 space-y-1" id="ui-commentary">
                        <div class="text-emerald-400">Match Started!</div>
                    </div>
                </div>
            </div>
        </div>

        <div id="action-msg" class="w-full text-center py-2 font-black text-[#ffd700] uppercase text-xs bg-black/50 rounded-lg mb-2">Make Your Move</div>

        <div class="glass p-3 rounded-b-2xl border-t border-slate-700 mt-auto bg-[#050b14]/90">
            <div class="grid grid-cols-4 md:grid-cols-7 gap-2">
                <button onclick="sendMove(0)" class="btn-move bg-[#0a1128] text-slate-400 rounded-xl py-4 text-2xl font-black border border-slate-700">0</button>
                <button onclick="sendMove(1)" class="btn-move bg-[#0a1128] text-white rounded-xl py-4 text-2xl font-black border border-slate-700">1</button>
                <button onclick="sendMove(2)" class="btn-move bg-[#0a1128] text-white rounded-xl py-4 text-2xl font-black border border-slate-700">2</button>
                <button onclick="sendMove(3)" class="btn-move bg-[#0a1128] text-white rounded-xl py-4 text-2xl font-black border border-slate-700">3</button>
                <button onclick="sendMove(4)" class="btn-move bg-[#0a1128] text-emerald-400 rounded-xl py-4 text-2xl font-black border border-slate-700">4</button>
                <button onclick="sendMove(5)" class="btn-move bg-[#0a1128] text-white rounded-xl py-4 text-2xl font-black border border-slate-700">5</button>
                <button onclick="sendMove(6)" class="btn-move bg-[#0a1128] text-purple-400 rounded-xl py-4 text-2xl font-black border border-slate-700 col-span-2 md:col-span-1">6</button>
            </div>
        </div>
    </div>

    <!-- SUMMARY -->
    <div id="summary-screen" class="screen p-4 max-w-4xl mx-auto w-full pt-8">
        <div class="glass p-8 rounded-[2rem] border-t-4 border-[#ffd700] text-center">
            <h2 class="text-4xl font-black uppercase text-white mb-2 score-font">Match Concluded</h2>
            <div class="text-2xl font-black text-[#ffd700] uppercase mb-8" id="summary-result">Result</div>
            <button onclick="nav('dashboard')" class="bg-blue-600 px-8 py-3 rounded-xl font-black text-white uppercase">Dashboard</button>
        </div>
    </div>

    <!-- BOWLER MODAL -->
    <div id="bowler-modal" style="display: none;" class="fixed inset-0 bg-black/95 backdrop-blur-lg items-center justify-center p-4 flex-col">
        <div class="glass p-6 rounded-[2rem] w-full max-w-md border-t-4 border-red-500 text-center">
            <h3 class="text-3xl font-black uppercase text-white mb-2 score-font">Select Bowler</h3>
            <div id="bowler-list" class="space-y-3 max-h-72 overflow-y-auto pr-2 custom-scroll"></div>
        </div>
    </div>

    <script>
        const fc = { apiKey: "AIzaSyAofevQrPWUKWxWAkBLtXl4f_lH5FjjPZE", authDomain: "hand-cricket-c2d70.firebaseapp.com", databaseURL: "https://hand-cricket-c2d70-default-rtdb.firebaseio.com", projectId: "hand-cricket-c2d70" };
        firebase.initializeApp(fc); const auth = firebase.auth(); const db = firebase.database();
        
        let u=null, mRole=null, mId=null; 
        let squadData = { name: "Team", p: [] };

        const sfx = { click: document.getElementById('sfx-click'), wicket: document.getElementById('sfx-w') };
        function playSound(type) { try { if(sfx[type]) { sfx[type].currentTime = 0; sfx[type].play().catch(()=>{}); } } catch(e) {} }

        const pInp = document.getElementById('player-inputs');
        for(let i=1; i<=11; i++) {
            pInp.innerHTML += `<div class="flex items-center bg-black/50 border border-white/10 rounded-lg"><div class="bg-white/10 px-3 py-3 font-mono text-xs font-black text-white/50 w-10 text-center border-r border-white/10">${i}</div><input type="text" id="sq-${i}" placeholder="Player Name" class="w-full bg-transparent text-white px-3 py-3 text-sm outline-none font-bold uppercase"></div>`;
        }

        const screens = ['login', 'dashboard', 'match-config', 'lobby', 'arena', 'squad-builder', 'summary-screen'];
        function nav(id) { screens.forEach(s => { let el = document.getElementById(s); if(el) el.classList.remove('active-screen'); }); document.getElementById(id).classList.add('active-screen'); }
        
        function login() { auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }
        
        auth.onAuthStateChanged(user => { 
            if(user) { 
                u = user; document.getElementById('nav-user').innerText = u.displayName.split(" ")[0]; 
                let localSquad = localStorage.getItem('savedSquad');
                if(localSquad) { squadData = JSON.parse(localSquad); fillSquadUI(); }
                nav('dashboard'); 
            } else { nav('login'); } 
        });

        function fillSquadUI() {
            document.getElementById('team-name').value = squadData.name;
            for(let i=1; i<=11; i++) { if(squadData.p[i-1]) document.getElementById(`sq-${i}`).value = squadData.p[i-1]; }
        }

        function prepSetup(type) { nav('squad-builder'); }
        
        function saveSquadAndProceed() {
            squadData.name = document.getElementById('team-name').value || "Team";
            squadData.p = [];
            for(let i=1; i<=11; i++) squadData.p.push(document.getElementById(`sq-${i}`).value.trim() || `Player ${i}`);
            localStorage.setItem('savedSquad', JSON.stringify(squadData));
            if(mRole === 'join_prep') finishJoin(); else nav('match-config');
        }

        function hostMatch() {
            mId = Math.random().toString(36).substring(2,7).toUpperCase(); mRole = 'p1';
            let ov = parseInt(document.getElementById('m-overs').value); 
            let wk = parseInt(document.getElementById('m-wickets').value);
            let hostChoice = document.getElementById('m-role').value; // 'bat' or 'bowl'
            let batRole = hostChoice === 'bat' ? 'p1' : 'p2';
            
            let initSt = { r:0, b:0, o:0, br:0, w:0 };
            db.ref('matches/'+mId).set({
                status: 'waiting', set: { ov: ov, wk: wk }, p1: { uid: u.uid, name: u.displayName, team: squadData },
                state: { inn: 1, bat: batRole, scr: 0, wic: 0, bls: 0, trg: 0, sIdx: 0, nsIdx: 1, bwIdx: 10, needBw: false, st: { p1: Array(11).fill().map(()=>({...initSt})), p2: Array(11).fill().map(()=>({...initSt})) }, sum: [], comm: [], mov: { p1: null, p2: null } }
            }).then(() => { 
                document.getElementById('lobby-code').innerText = mId; 
                nav('lobby'); 
                listenMatch(); 
            });
        }

        function joinAction() {
            let code = document.getElementById('join-input').value.toUpperCase().trim();
            if(!code) return;
            db.ref('matches/'+code).once('value', s => {
                if(s.exists()) {
                    let d = s.val();
                    if(d.status === 'waiting') { mId = code; mRole = 'join_prep'; nav('squad-builder'); }
                    else { mId = code; mRole = (d.p1.uid === u.uid) ? 'p1' : 'p2'; listenMatch(); }
                } else alert("Invalid Code");
            });
        }

        function finishJoin() {
            mRole = 'p2'; 
            db.ref('matches/'+mId).update({ status: 'playing', p2: { uid: u.uid, name: u.displayName, team: squadData } }).then(()=> listenMatch());
        }

        function listenMatch() {
            db.ref('matches/'+mId).on('value', snap => {
                let m = snap.val(); if(!m) return;
                
                // FORCE START: Agar p2 join kar liya hai aur host/guest dono connected hain, to status 'playing' kar do
                if(m.status === 'waiting' && m.p2 && mRole === 'p1') {
                    db.ref('matches/'+mId).update({ status: 'playing' });
                }

                if(m.status === 'playing') {
                    nav('arena');
                    if(mRole === 'p1' && m.state.mov.p1 !== null && m.state.mov.p2 !== null) calcBall(m);
                    renderScore(m);
                }
            });
        }

        window.sendMove = function(v) {
            playSound('click');
            document.querySelectorAll('.btn-move').forEach(b => b.classList.remove('selected-move'));
            event.target.classList.add('selected-move');
            document.getElementById('action-msg').innerText = "WAITING FOR OPPONENT...";
            db.ref(`matches/${mId}/state/mov/${mRole}`).set(v);
        }

        function calcBall(m) {
            let s = m.state; let r1 = s.mov.p1; let r2 = s.mov.p2;
            let btM = s.bat === 'p1' ? r1 : r2; let bwM = s.bat === 'p2' ? r1 : r2;
            let res = '', run = 0;

            if(btM === 0 && bwM === 0) res = '0';
            else if(btM === bwM) res = 'W';
            else { run = btM; res = run; s.scr += run; }

            s.bls++;
            if(!s.sum) s.sum = []; s.sum.push(res);

            if(s.bls >= m.set.ov * 6 || s.wic >= m.set.wk) {
                db.ref('matches/'+mId+'/status').set('finished');
            }

            s.mov = {p1:null, p2:null};
            db.ref(`matches/'+mId+'/state`).set(s);
        }

        function renderScore(m) {
            let s = m.state; let bRole = s.bat; 
            let tBat = bRole === 'p1' ? m.p1 : m.p2; 
            let tBw = bRole === 'p2' ? m.p1 : m.p2;
            
            document.getElementById('ui-bat-team').innerText = (tBat?.team?.name || "BAT") + " (BAT)";
            document.getElementById('ui-bowl-team').innerText = (tBw?.team?.name || "BOWL") + " (BOWL)";
            document.getElementById('ui-score').innerHTML = `${s.scr}<span class="text-xl text-slate-400">/${s.wic}</span>`;
            document.getElementById('ui-overs').innerText = `${Math.floor(s.bls/6)}.${s.bls%6}`;
            document.getElementById('ui-max-overs').innerText = `(/${m.set.ov})`;

            if(s.mov[mRole] === null) {
                document.querySelectorAll('.btn-move').forEach(b => b.classList.remove('selected-move'));
                if(m.status !== 'finished') document.getElementById('action-msg').innerText = "MAKE YOUR MOVE";
            }
        }
    </script>
</body>
</html>
