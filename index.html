<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UR STUDIO | Sign In</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #050505;
            color: white;
            overflow: hidden;
        }

        /* Cinematic Aurora Background */
        .aurora-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at 20% 30%, rgba(220, 38, 38, 0.15) 0%, transparent 40%),
                        radial-gradient(circle at 80% 70%, rgba(234, 179, 8, 0.1) 0%, transparent 40%),
                        radial-gradient(circle at 50% 50%, rgba(30, 27, 75, 0.4) 0%, #050505 100%);
            z-index: -1;
            animation: pulse 10s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }

        /* iOS Glassmorphism Card */
        .glass-card {
            background: rgba(25, 25, 25, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* Dynamic Island */
        .dynamic-island {
            width: 120px;
            height: 35px;
            background: #000;
            border-radius: 20px;
            margin: 0 auto 30px auto;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            overflow: hidden;
        }

        .dynamic-island.active {
            width: 200px;
            height: 40px;
        }

        .dynamic-island-content {
            opacity: 0;
            transform: scale(0.8);
            transition: all 0.3s ease;
            font-size: 12px;
            color: #4ade80;
            display: none;
        }

        .dynamic-island.active .dynamic-island-content {
            opacity: 1;
            transform: scale(1);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .loading-spinner {
            border: 2px solid rgba(255,255,255,0.1);
            border-left-color: #fff;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">

    <div class="aurora-bg"></div>

    <!-- Main Login Card -->
    <div class="glass-card w-full max-w-sm rounded-[40px] p-8 text-center relative z-10 mx-4">
        
        <!-- Dynamic Island -->
        <div id="dynamicIsland" class="dynamic-island mt-2 shadow-lg">
            <div id="islandContent" class="dynamic-island-content">
                <div class="loading-spinner"></div>
                <span id="islandText">Connecting...</span>
            </div>
        </div>

        <h1 class="text-3xl font-bold tracking-widest text-white mb-2" style="font-family: 'Times New Roman', serif;">UR STUDIO</h1>
        <p class="text-sm text-gray-400 mb-10">Where stories come alive.</p>

        <div id="authContainer">
            <!-- Google Sign In Button -->
            <button id="googleLoginBtn" class="w-full bg-white/10 hover:bg-white/20 border border-white/10 text-white font-semibold py-4 px-6 rounded-2xl flex items-center justify-center gap-4 transition-all duration-300 group">
                <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" class="w-6 h-6 group-hover:scale-110 transition-transform">
                <span>Continue with Google</span>
            </button>
        </div>

        <!-- Success Profile Display (Hidden by default, dikhega login ke baad) -->
        <div id="profileContainer" class="hidden flex-col items-center justify-center gap-4 mt-6">
            <img id="userAvatar" src="" alt="Profile" class="w-20 h-20 rounded-full border-2 border-[#D4AF37] shadow-[0_0_15px_rgba(212,175,55,0.3)] object-cover">
            <div>
                <h2 id="userName" class="text-xl font-semibold"></h2>
                <p id="userEmail" class="text-xs text-gray-400"></p>
            </div>
            <button id="dashboardBtn" class="mt-4 w-full bg-[#D4AF37] hover:bg-[#c5a030] text-black font-bold py-3 px-6 rounded-2xl transition-all duration-300">
                Enter Studio
            </button>
        </div>

        <p class="text-[10px] text-gray-500 mt-8">By continuing, you agree to our Terms of Service & Privacy Policy.</p>
    </div>

    <!-- Firebase Integration Logic -->
    <script type="module">
        // Firebase SDKs import
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // Tumhara exact Firebase config
        const firebaseConfig = {
            apiKey: "AIzaSyClLSLmdoz5PHVVJrxkoqZ02Xmm-nwsNXQ",
            authDomain: "urstudio-f341c.firebaseapp.com",
            projectId: "urstudio-f341c",
            storageBucket: "urstudio-f341c.firebasestorage.app",
            messagingSenderId: "1017863212287",
            appId: "1:1017863212287:web:2af7564d1aec2f02e310ca"
        };

        // Firebase Initialize
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        // UI Elements
        const loginBtn = document.getElementById('googleLoginBtn');
        const authContainer = document.getElementById('authContainer');
        const profileContainer = document.getElementById('profileContainer');
        const dynamicIsland = document.getElementById('dynamicIsland');
        const islandContent = document.getElementById('islandContent');
        const islandText = document.getElementById('islandText');
        const userAvatar = document.getElementById('userAvatar');
        const userName = document.getElementById('userName');
        const userEmail = document.getElementById('userEmail');

        // Handle Login Click
        loginBtn.addEventListener('click', () => {
            // Dynamic Island Animation
            dynamicIsland.classList.add('active');
            islandContent.style.display = 'flex';
            islandText.innerText = "Authenticating...";

            // Asli Google Popup Trigger hoga yahan se
            signInWithPopup(auth, provider)
                .then((result) => {
                    const user = result.user;
                    
                    // Success! Island update karo
                    islandText.innerText = "Access Granted";
                    islandText.style.color = "#4ade80"; // Green
                    document.querySelector('.loading-spinner').style.display = 'none';
                    islandContent.innerHTML = '<i class="fa-solid fa-check"></i> <span style="color:#4ade80;">Welcome back</span>';
                    
                    // Login button chhupao, User Profile dikhao
                    authContainer.classList.add('hidden');
                    profileContainer.classList.remove('hidden');
                    profileContainer.classList.add('flex');

                    // Photo aur Naam Set karo
                    userAvatar.src = user.photoURL;
                    userName.innerText = user.displayName;
                    userEmail.innerText = user.email;

                    setTimeout(() => {
                        dynamicIsland.classList.remove('active');
                    }, 3000);

                }).catch((error) => {
                    console.error("Error:", error);
                    islandText.innerText = "Failed!";
                    islandText.style.color = "#ef4444"; // Red
                    document.querySelector('.loading-spinner').style.display = 'none';

                    alert("Login cancel ho gaya ya error aaya: " + error.message);

                    setTimeout(() => {
                        dynamicIsland.classList.remove('active');
                        islandContent.style.display = 'none';
                        islandContent.innerHTML = '<div class="loading-spinner"></div><span id="islandText">Connecting...</span>';
                    }, 2000);
                });
        });

        // Enter Studio Button (Dashboard par jaane ke liye)
        document.getElementById('dashboardBtn').addEventListener('click', () => {
            alert("Ab hum next step mein tumhara Studio Dashboard design karenge!");
            // Baad mein yahan link lagayenge: window.location.href = "dashboard.html";
        });
    </script>
</body>
</html>
