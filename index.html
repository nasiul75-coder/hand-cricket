<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hand Cricket Pro - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Apple-style smooth typography and background */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
        body { 
            font-family: 'Inter', sans-serif; 
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #f8fafc; 
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* Premium Frosted Glass Effect */
        .glass-panel { 
            background: rgba(255, 255, 255, 0.05); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1); 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .google-btn {
            background: rgba(255, 255, 255, 0.9);
            color: #000;
            transition: all 0.3s ease;
        }
        .google-btn:hover {
            background: #fff;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(255,255,255,0.2);
        }
    </style>
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div id="login-section" class="glass-panel w-full max-w-md p-10 rounded-[2rem] text-center mx-4">
        <div class="mb-8">
            <div class="w-20 h-20 bg-gradient-to-tr from-blue-500 to-emerald-400 rounded-2xl mx-auto flex items-center justify-center shadow-lg mb-6 transform rotate-3">
                <span class="text-4xl">🏏</span>
            </div>
            <h1 class="text-3xl font-extrabold tracking-tight mb-2">Hand Cricket <span class="text-emerald-400">Pro</span></h1>
            <p class="text-slate-400 text-sm">Sign in to sync your career stats and trophies.</p>
        </div>

        <button onclick="loginWithGoogle()" class="google-btn w-full py-4 rounded-xl font-bold text-lg flex items-center justify-center gap-3">
            <svg class="w-6 h-6" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
            Continue with Google
        </button>
    </div>

    <!-- DASHBOARD SCREEN (Hidden until logged in) -->
    <div id="dashboard-section" class="hidden glass-panel w-full max-w-4xl p-10 rounded-[2rem] mx-4">
        <div class="flex items-center justify-between border-b border-white/10 pb-6 mb-6">
            <div class="flex items-center gap-4">
                <img id="user-profile-pic" src="" class="w-16 h-16 rounded-full border-2 border-emerald-400 shadow-lg object-cover" alt="Profile">
                <div>
                    <h2 id="user-name" class="text-2xl font-bold">Player Name</h2>
                    <p class="text-emerald-400 text-sm">Professional Player</p>
                </div>
            </div>
            <button onclick="logout()" class="text-slate-400 hover:text-white text-sm transition">Sign Out</button>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8 text-center">
            <div class="bg-white/5 p-4 rounded-2xl border border-white/5">
                <div class="text-slate-400 text-xs uppercase tracking-widest mb-1">Matches</div>
                <div class="text-2xl font-bold">0</div>
            </div>
            <div class="bg-white/5 p-4 rounded-2xl border border-white/5">
                <div class="text-slate-400 text-xs uppercase tracking-widest mb-1">Runs</div>
                <div class="text-2xl font-bold">0</div>
            </div>
            <div class="bg-white/5 p-4 rounded-2xl border border-white/5">
                <div class="text-slate-400 text-xs uppercase tracking-widest mb-1">Strike Rate</div>
                <div class="text-2xl font-bold">0.0</div>
            </div>
            <div class="bg-white/5 p-4 rounded-2xl border border-white/5">
                <div class="text-slate-400 text-xs uppercase tracking-widest mb-1">Trophies</div>
                <div class="text-2xl font-bold">🏆 0</div>
            </div>
        </div>
        
        <button class="w-full bg-gradient-to-r from-blue-600 to-emerald-500 py-4 rounded-xl font-bold text-lg shadow-lg hover:opacity-90 transition">
            Enter Matchmaking Lobby ➔
        </button>
    </div>

    <!-- FIREBASE AUTHENTICATION LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-auth.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyAofevQrPWUKWxWAkBLtXl4f_lH5fjjPZE",
            authDomain: "hand-cricket-c2d70.firebaseapp.com",
            databaseURL: "https://hand-cricket-c2d70-default-rtdb.firebaseio.com",
            projectId: "hand-cricket-c2d70",
            storageBucket: "hand-cricket-c2d70.firebasestorage.app",
            messagingSenderId: "113004537618",
            appId: "1:113004537618:web:9f23689c5c4c4a62eaf5cb"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        window.loginWithGoogle = function() {
            signInWithPopup(auth, provider).catch((error) => {
                alert("Login Error: " + error.message);
            });
        }

        window.logout = function() {
            signOut(auth);
        }

        // Real-time check if user is logged in
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // Hide Login, Show Dashboard
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('dashboard-section').classList.remove('hidden');
                
                // Put user data in UI
                document.getElementById('user-name').innerText = user.displayName;
                document.getElementById('user-profile-pic').src = user.photoURL;
            } else {
                // Show Login, Hide Dashboard
                document.getElementById('login-section').classList.remove('hidden');
                document.getElementById('dashboard-section').classList.add('hidden');
            }
        });
    </script>
</body>
</html>
