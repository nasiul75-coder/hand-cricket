<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hand Cricket Pro - Multiplayer Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap');
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #0f172a;
            color: #f8fafc; margin: 0; min-height: 100vh; overflow-x: hidden;
        }
        .glass-panel { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .action-btn { transition: transform 0.1s; }
        .action-btn:active { transform: scale(0.90); background: #3b82f6 !important; }
        .move-selected { border-color: #10b981 !important; box-shadow: 0 0 15px rgba(16,185,129,0.5); }
    </style>

    <!-- FIREBASE COMPAT SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-database-compat.js"></script>
</head>
<body class="flex flex-col h-screen">

    <!-- TOP NAVIGATION -->
    <header class="w-full p-3 flex justify-between items-center bg-slate-900 border-b border-slate-800 z-50 shadow-md" id="top-nav">
        <div class="flex items-center gap-2" onclick="switchScreen('dashboard-section')">
            <i class="fa-solid fa-bolt text-emerald-500 text-xl"></i>
            <h1 class="text-lg font-black tracking-widest">HC <span class="text-emerald-400">PRO</span></h1>
        </div>
        <div class="flex items-center gap-3">
            <span id="user-name" class="text-xs font-bold uppercase text-slate-300">Player</span>
            <button onclick="logout()" class="text-red-400 hover:text-red-300 text-xs font-bold uppercase"><i class="fa-solid fa-power-off"></i></button>
        </div>
    </header>

    <!-- 1. LOGIN -->
    <div id="login-section" class="flex-1 flex flex-col items-center justify-center p-4">
        <div class="glass-panel w-full max-w-sm p-8 rounded-3xl text-center shadow-2xl">
            <h1 class="text-3xl font-black mb-6">LOG IN</h1>
            <button onclick="loginWithGoogle()" class="w-full bg-white text-black py-4 rounded-xl font-bold flex justify-center items-center gap-3 shadow-lg">
                <i class="fa-brands fa-google text-blue-500"></i> Google
            </button>
        </div>
    </div>

    <!-- 2. DASHBOARD -->
    <div id="dashboard-section" class="hidden flex-1 flex flex-col p-4 space-y-4 max-w-2xl mx-auto w-full">
        <!-- Join Bar -->
        <div class="flex gap-2 bg-slate-800 p-2 rounded-xl">
            <input type="text" id="join-code" placeholder="Enter Code" class="bg-transparent flex-1 px-3 text-white font-mono uppercase font-bold outline-none">
            <button onclick="joinMatch()" class="bg-emerald-600 text-white px-6 py-3 rounded-lg font-bold">JOIN</button>
        </div>

        <div class="grid grid-cols-2 gap-4 mt-4">
            <button onclick="switchScreen('match-setup-section')" class="bg-blue-600 p-6 rounded-2xl text-left shadow-lg">
                <i class="fa-solid fa-gamepad text-3xl mb-2"></i>
                <h3 class="font-black text-xl uppercase">Create Match</h3>
            </button>
            <button onclick="switchScreen('tourney-setup-section')" class="bg-purple-600 p-6 rounded-2xl text-left shadow-lg">
                <i class="fa-solid fa-trophy text-3xl mb-2"></i>
                <h3 class="font-black text-xl uppercase">Tournament</h3>
            </button>
        </div>
        
        <div class="mt-4 bg-slate-800 p-4 rounded-xl border border-slate-700">
            <h3 class="text-slate-400 font-bold text-xs uppercase mb-2">Saved Games</h3>
            <button class="w-full bg-slate-700 p-3 rounded-lg text-left font-bold text-sm mb-2"><i class="fa-solid fa-play text-emerald-400 mr-2"></i> Resume Current Match</button>
            <button class="w-full bg-slate-700 p-3 rounded-lg text-left font-bold text-sm"><i class="fa-solid fa-list text-purple-400 mr-2"></i> Active Tournament</button>
        </div>
    </div>

    <!-- 3. MATCH SETUP -->
    <div id="match-setup-section" class="hidden flex-1 flex flex-col p-4 max-w-xl mx-auto w-full">
        <h2 class="text-2xl font-black uppercase mb-4">Match Setup</h2>
        <div class="space-y-4 bg-slate-800 p-6 rounded-2xl">
            <div>
                <label class="text-xs font-bold text-slate-400 uppercase">Format</label>
                <select id="setup-format" class="w-full bg-slate-700 p-3 rounded-lg text-white font-bold mt-1 outline-none">
                    <option value="T20">T20 (20 Overs)</option>
                    <option value="ODI">ODI (50 Overs)</option>
                </select>
            </div>
            <div>
                <label class="text-xs font-bold text-slate-400 uppercase">Wickets</label>
                <select id="setup-wickets" class="w-full bg-slate-700 p-3 rounded-lg text-white font-bold mt-1 outline-none">
                    <option value="3">3 Wickets</option>
                    <option value="5">5 Wickets</option>
                    <option value="10" selected>10 Wickets</option>
                </select>
            </div>
            <button onclick="hostMatch()" class="w-full bg-emerald-600 py-4 rounded-xl font-black text-lg mt-4 shadow-lg">HOST MATCH</button>
        </div>
    </div>

    <!-- 4. LOBBY -->
    <div id="lobby-section" class="hidden flex-1 flex flex-col items-center justify-center p-4">
        <div class="glass-panel p-8 rounded-3xl text-center w-full max-w-sm">
            <p class="text-emerald-400 font-bold uppercase tracking-widest text-xs mb-2">Room Created</p>
            <h1 class="text-5xl font-mono font-black text-white mb-6 tracking-widest" id="display-room-code">----</h1>
            <p class="text-slate-400 animate-pulse text-sm"><i class="fa-solid fa-spinner fa-spin mr-2"></i>Waiting for opponent...</p>
        </div>
    </div>

    <!-- 5. MATCH ARENA (COMPACT FOR MOVES) -->
    <div id="match-arena-section" class="hidden flex-1 flex-col p-2 w-full max-w-3xl mx-auto">
        
        <!-- Scoreboard -->
        <div class="bg-slate-900 border border-slate-700 rounded-xl p-4 flex justify-between items-center shadow-lg">
            <div class="w-1/3">
                <div class="text-[10px] text-slate-400 font-bold uppercase" id="batting-team">Host (Bat)</div>
                <div class="text-3xl font-black" id="score-display">0<span class="text-lg text-slate-400">/0</span></div>
            </div>
            <div class="w-1/3 text-center">
                <div class="text-emerald-400 font-bold text-xs uppercase" id="match-status-banner">Innings 1</div>
                <div class="text-sm font-bold text-slate-300">Overs: <span id="overs-display" class="text-white">0.0</span></div>
            </div>
            <div class="w-1/3 text-right">
                <div class="text-[10px] text-slate-400 font-bold uppercase" id="bowling-team">Guest (Bowl)</div>
                <div class="text-xs text-slate-400 font-bold">Target: <span id="target-display" class="text-white">--</span></div>
            </div>
        </div>

        <!-- Strike & Bowler Stats -->
        <div class="grid grid-cols-2 gap-2 mt-2">
            <!-- Batters -->
            <div class="bg-slate-800 p-3 rounded-xl border-l-4 border-blue-500">
                <h4 class="text-[10px] uppercase text-slate-400 font-bold mb-1">Batters</h4>
                <div class="flex justify-between items-center text-sm font-bold bg-slate-700/50 p-1.5 rounded" id="striker-ui">
                    <span><i class="fa-solid fa-caret-right text-blue-400 mr-1"></i><span id="striker-name">Player 1</span></span>
                    <span id="striker-score">0 (0)</span>
                </div>
                <div class="flex justify-between items-center text-xs text-slate-400 p-1.5">
                    <span class="pl-3" id="non-striker-name">Player 2</span>
                    <span id="non-striker-score">0 (0)</span>
                </div>
            </div>
            <!-- Bowler -->
            <div class="bg-slate-800 p-3 rounded-xl border-l-4 border-red-500 flex flex-col justify-between">
                <div>
                    <h4 class="text-[10px] uppercase text-slate-400 font-bold mb-1">Bowler</h4>
                    <div class="text-sm font-bold text-white"><i class="fa-solid fa-baseball text-red-400 mr-1"></i><span id="bowler-name">Bowler 1</span></div>
                </div>
                <!-- Over Summary -->
                <div class="flex gap-1 overflow-x-auto mt-2" id="over-summary-container">
                    <!-- 0, 1, W, 4, 6 will appear here -->
                </div>
            </div>
        </div>

        <!-- Notification Area -->
        <div id="game-message" class="text-center font-bold text-yellow-400 mt-4 h-6 text-sm uppercase tracking-widest">Make your move...</div>

        <!-- Moves Controller (Stick to bottom half) -->
        <div class="mt-auto bg-slate-900 border border-slate-800 p-3 rounded-2xl mb-2">
            <div class="grid grid-cols-4 gap-2 mb-2">
                <button onclick="submitMove(1)" class="action-btn move-btn bg-slate-800 border-2 border-slate-700 text-white font-black text-2xl py-4 rounded-xl">1</button>
                <button onclick="submitMove(2)" class="action-btn move-btn bg-slate-800 border-2 border-slate-700 text-white font-black text-2xl py-4 rounded-xl">2</button>
                <button onclick="submitMove(3)" class="action-btn move-btn bg-slate-800 border-2 border-slate-700 text-white font-black text-2xl py-4 rounded-xl">3</button>
                <button onclick="submitMove(4)" class="action-btn move-btn bg-slate-800 border-2 border-slate-700 text-white font-black text-2xl py-4 rounded-xl text-emerald-400">4</button>
            </div>
            <div class="grid grid-cols-3 gap-2">
                <button onclick="submitMove(0)" class="action-btn move-btn bg-slate-800 border-2 border-slate-700 text-slate-400 font-black text-2xl py-4 rounded-xl">0</button>
                <button onclick="submitMove(5)" class="action-btn move-btn bg-slate-800 border-2 border-slate-700 text-white font-black text-2xl py-4 rounded-xl">5</button>
                <button onclick="submitMove(6)" class="action-btn move-btn bg-slate-800 border-2 border-slate-700 text-purple-400 font-black text-2xl py-4 rounded-xl">6</button>
            </div>
        </div>
    </div>

    <!-- FIREBASE JAVASCRIPT LOGIC -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAofevQrPWUKWxWAkBLtXl4f_lH5FjjPZE",
            authDomain: "hand-cricket-c2d70.firebaseapp.com",
            databaseURL: "https://hand-cricket-c2d70-default-rtdb.firebaseio.com",
            projectId: "hand-cricket-c2d70"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();
        
        let currentUser = null;
        let currentRoomId = null;
        let myRole = null; // 'host' or 'guest'
        let isMyTurn = false; 
        
        // Screens
        const screens = ['login-section', 'dashboard-section', 'match-setup-section', 'lobby-section', 'match-arena-section'];
        function switchScreen(id) {
            screens.forEach(s => {
                document.getElementById(s).classList.add('hidden');
                document.getElementById(s).classList.remove('flex');
            });
            document.getElementById(id).classList.remove('hidden');
            document.getElementById(id).classList.add('flex');
        }

        // AUTH
        window.loginWithGoogle = () => auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
        window.logout = () => auth.signOut();

        auth.onAuthStateChanged(user => {
            if (user) {
                currentUser = user;
                document.getElementById('user-name').innerText = user.displayName.split(" ")[0];
                switchScreen('dashboard-section');
            } else {
                switchScreen('login-section');
            }
        });

        // ------------------ MULTIPLAYER MATCH LOGIC ------------------

        window.hostMatch = function() {
            const format = document.getElementById('setup-format').value;
            const wickets = parseInt(document.getElementById('setup-wickets').value);
            const code = Math.random().toString(36).substring(2, 7).toUpperCase();
            currentRoomId = code;
            myRole = 'host';

            // Initial Match State in DB
            db.ref('matches/' + code).set({
                settings: { format, maxWickets: wickets },
                status: 'waiting',
                host: { uid: currentUser.uid, name: currentUser.displayName },
                matchState: {
                    inning: 1,
                    battingRole: 'host', // Host bats first by default (can add toss later)
                    score: 0,
                    wicketsLost: 0,
                    balls: 0,
                    target: null,
                    overSummary: [],
                    strikers: { s: 0, ns: 0 }, // Player runs
                    currentMove: { host: null, guest: null } // Both hide moves here
                }
            }).then(() => {
                document.getElementById('display-room-code').innerText = code;
                switchScreen('lobby-section');
                listenToMatch(code);
            });
        }

        window.joinMatch = function() {
            const code = document.getElementById('join-code').value.toUpperCase().trim();
            if(!code) return;
            
            db.ref('matches/' + code).once('value').then(snap => {
                if(snap.exists() && snap.val().status === 'waiting') {
                    currentRoomId = code;
                    myRole = 'guest';
                    db.ref('matches/' + code).update({
                        status: 'playing',
                        guest: { uid: currentUser.uid, name: currentUser.displayName }
                    }).then(() => {
                        listenToMatch(code);
                        switchScreen('match-arena-section');
                    });
                } else {
                    alert("Invalid Code or Match Started!");
                }
            });
        }

        // Listener for Realtime Logic
        function listenToMatch(code) {
            db.ref('matches/' + code).on('value', snap => {
                const match = snap.val();
                if(!match) return;

                // Move from Lobby to Arena when guest joins
                if(match.status === 'playing' && myRole === 'host' && document.getElementById('lobby-section').classList.contains('flex')) {
                    switchScreen('match-arena-section');
                }

                updateUI(match);
                
                // HOST resolves the ball when both players have submitted moves
                if(myRole === 'host' && match.matchState.currentMove.host !== null && match.matchState.currentMove.guest !== null) {
                    processBall(match);
                }
            });
        }

        // Action when user taps 0-6
        window.submitMove = function(number) {
            if(!currentRoomId) return;
            
            // Highlight button
            document.querySelectorAll('.move-btn').forEach(btn => btn.classList.remove('move-selected'));
            event.target.classList.add('move-selected');
            document.getElementById('game-message').innerText = "Waiting for opponent...";

            // Push move to DB (hidden from other player until both submit)
            db.ref(`matches/${currentRoomId}/matchState/currentMove/${myRole}`).set(number);
        }

        // THE CORE GAME RULES ENGINE (Only Host Runs This)
        function processBall(match) {
            let state = match.matchState;
            let hostMove = state.currentMove.host;
            let guestMove = state.currentMove.guest;
            
            let batterMove = state.battingRole === 'host' ? hostMove : guestMove;
            let bowlerMove = state.battingRole === 'guest' ? hostMove : guestMove;

            let result = '';
            
            // RULE: 0-0 IS A DOT BALL, NOT OUT.
            if (batterMove === 0 && bowlerMove === 0) {
                result = '0'; // Dot
                state.balls++;
            } 
            // RULE: OUT
            else if (batterMove === bowlerMove) {
                result = 'W';
                state.wicketsLost++;
                state.balls++;
                state.strikers.s = 0; // New batter comes in (Score resets)
            } 
            // RULE: RUNS SCORED
            else {
                result = batterMove;
                state.score += batterMove;
                state.strikers.s += batterMove;
                state.balls++;
                
                // Strike Rotation on 1, 3, 5
                if(batterMove % 2 !== 0) {
                    let temp = state.strikers.s;
                    state.strikers.s = state.strikers.ns;
                    state.strikers.ns = temp;
                }
            }

            // Update Over Summary Array
            if(!state.overSummary) state.overSummary = [];
            state.overSummary.push(result);

            // Over completion Logic (6 balls)
            if(state.balls % 6 === 0) {
                // Strike rotates at end of over automatically
                let temp = state.strikers.s;
                state.strikers.s = state.strikers.ns;
                state.strikers.ns = temp;
                state.overSummary = []; // Clear summary for new bowler
                
                // Implement prompt for new bowler here in future updates
            }

            // Innings Change / Match End Logic
            if (state.wicketsLost >= match.settings.maxWickets) {
                if(state.inning === 1) {
                    // Start Innings 2
                    state.inning = 2;
                    state.target = state.score + 1;
                    state.battingRole = state.battingRole === 'host' ? 'guest' : 'host';
                    state.score = 0;
                    state.wicketsLost = 0;
                    state.balls = 0;
                    state.strikers = {s:0, ns:0};
                    state.overSummary = [];
                } else {
                    db.ref(`matches/${currentRoomId}/status`).set('finished');
                }
            }

            // Target Chased
            if (state.inning === 2 && state.score >= state.target) {
                db.ref(`matches/${currentRoomId}/status`).set('finished');
            }

            // Reset moves and push updated state
            state.currentMove = { host: null, guest: null };
            db.ref(`matches/${currentRoomId}/matchState`).set(state);
        }

        // Update Scoreboard UI
        function updateUI(match) {
            let state = match.matchState;
            
            // Set Names based on Role
            let batName = state.battingRole === 'host' ? match.host.name : match.guest?.name || 'Guest';
            let bowlName = state.battingRole === 'guest' ? match.host.name : match.guest?.name || 'Guest';
            document.getElementById('batting-team').innerText = batName + " (BAT)";
            document.getElementById('bowling-team').innerText = bowlName + " (BOWL)";
            
            // Score & Overs
            document.getElementById('score-display').innerHTML = `${state.score}<span class="text-lg text-slate-400">/${state.wicketsLost}</span>`;
            
            let overs = Math.floor(state.balls / 6);
            let balls = state.balls % 6;
            document.getElementById('overs-display').innerText = `${overs}.${balls}`;

            // Strikers
            document.getElementById('striker-score').innerText = state.strikers.s;
            document.getElementById('non-striker-score').innerText = state.strikers.ns;
            
            document.getElementById('target-display').innerText = state.target ? state.target : '--';
            document.getElementById('match-status-banner').innerText = state.inning === 1 ? "Innings 1" : "Chase";

            // Over Summary Box
            let summaryHTML = '';
            if(state.overSummary) {
                state.overSummary.forEach(ball => {
                    let color = 'bg-slate-700';
                    if(ball === 'W') color = 'bg-red-600';
                    if(ball === 4 || ball === 6) color = 'bg-emerald-600';
                    summaryHTML += `<div class="w-6 h-6 rounded flex items-center justify-center text-xs font-bold text-white ${color}">${ball}</div>`;
                });
            }
            document.getElementById('over-summary-container').innerHTML = summaryHTML;

            // Reset UI for next turn
            if(state.currentMove[myRole] === null) {
                document.querySelectorAll('.move-btn').forEach(btn => btn.classList.remove('move-selected'));
                if (match.status === 'finished') {
                    let winner = state.score >= state.target ? batName : bowlName;
                    document.getElementById('game-message').innerText = `MATCH OVER! ${winner} WON!`;
                } else {
                    document.getElementById('game-message').innerText = "MAKE YOUR MOVE";
                }
            }
        }
    </script>
</body>
</html>
