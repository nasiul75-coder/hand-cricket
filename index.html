<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hand Cricket Pro - Fixed Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: #f8fafc; margin: 0; min-height: 100vh; overflow-x: hidden; }
        .glass { background: rgba(10, 20, 40, 0.85); backdrop-filter: blur(16px); border: 1px solid rgba(255, 215, 0, 0.1); box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        .input-glass { background: rgba(0,0,0,0.8); border: 1px solid rgba(255,255,255,0.2); color: white; outline: none; transition: 0.3s; }
        .screen { display: none; width: 100%; min-height: calc(100vh - 64px); flex-direction: column; padding-bottom: 2rem; overflow-y: auto;}
        .active-screen { display: flex; }
        .btn-move { transition: transform 0.1s; } .btn-move:active { transform: scale(0.9); }
        .selected-move { border-color: #ffd700 !important; background: rgba(255,215,0,0.15) !important; color: white !important;}
        #bowler-modal { z-index: 9999; }
    </style>
    
    <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-database-compat.js"></script>
</head>
<body>

    <!-- NAV -->
    <header class="w-full h-16 px-4 flex justify-between items-center bg-[#050b14] border-b border-[#ffd700]/20 z-50 sticky top-0 shadow-lg">
        <div class="flex items-center gap-2 cursor-pointer" onclick="nav('dashboard')">
            <h1 class="text-xl font-black uppercase tracking-widest text-[#ffd700]">HC <span class="text-white">Pro</span></h1>
        </div>
        <div class="flex items-center gap-3">
            <span id="nav-user" class="text-sm font-bold uppercase text-slate-300">Player</span>
            <button onclick="auth.signOut()" class="text-red-500 hover:text-red-400 text-lg ml-2"><i class="fa-solid fa-power-off"></i></button>
        </div>
    </header>

    <!-- 1. LOGIN -->
    <div id="login" class="screen items-center justify-center p-4">
        <div class="glass w-full max-w-md p-10 rounded-[2rem] text-center border-t-2 border-[#ffd700]">
            <h1 class="text-5xl font-black mb-8 uppercase text-[#ffd700]">Log In</h1>
            <button onclick="login()" class="w-full bg-white text-black py-4 rounded-xl font-black text-lg flex justify-center items-center gap-3 shadow-xl hover:-translate-y-1 transition">Continue with Google</button>
        </div>
    </div>

    <!-- 2. DASHBOARD -->
    <div id="dashboard" class="screen p-4 max-w-5xl mx-auto w-full pt-6">
        <div class="flex flex-col md:flex-row gap-3 bg-black/60 p-4 rounded-2xl border border-white/10 mb-6 shadow-lg">
            <input type="text" id="join-input" placeholder="ENTER ROOM CODE" class="input-glass flex-1 p-4 rounded-xl font-mono font-bold uppercase text-center md:text-left text-lg">
            <button onclick="joinAction()" class="bg-blue-600 hover:bg-blue-500 py-4 px-10 rounded-xl font-black uppercase text-lg text-white">JOIN</button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <button onclick="prepSetup('match')" class="glass p-8 rounded-[2rem] text-left hover:border-blue-500 transition border-t-4 border-blue-600">
                <h2 class="font-black text-3xl uppercase">Create Match</h2>
            </button>
            <button onclick="prepSetup('tourney')" class="glass p-8 rounded-[2rem] text-left hover:border-[#ffd700] transition border-t-4 border-[#ffd700]">
                <h2 class="font-black text-3xl uppercase text-[#ffd700]">Tournament</h2>
            </button>
        </div>
    </div>

    <!-- 3. TEAM SQUAD BUILDER -->
    <div id="squad-builder" class="screen p-4 max-w-3xl mx-auto w-full pt-6">
        <h2 class="text-2xl font-black uppercase text-white mb-4">Set Playing 11</h2>
        <div class="glass p-6 sm:p-8 rounded-[2rem]">
            <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest block mb-2">Team Name</label>
            <input type="text" id="team-name" value="India" class="input-glass w-full p-4 rounded-xl font-black text-lg uppercase mb-6 border-[#ffd700]/30 text-[#ffd700]">
            <div id="player-inputs" class="grid grid-cols-1 sm:grid-cols-2 gap-3"></div>
            <button onclick="saveSquadAndProceed()" class="w-full bg-blue-600 py-4 rounded-xl font-black uppercase text-xl mt-6">Confirm Squad</button>
        </div>
    </div>

    <!-- 4. CONFIG -->
    <div id="match-config" class="screen p-4 max-w-xl mx-auto w-full pt-8">
        <div class="glass p-8 rounded-[2rem] border-t-4 border-blue-600">
            <h2 class="text-3xl font-black uppercase mb-6 text-blue-400 text-center">Match Rules</h2>
            <div class="space-y-4">
                <div><label class="text-xs font-black text-slate-400 uppercase">Overs</label>
                    <select id="m-overs" class="input-glass w-full p-3 rounded-lg font-bold"><option value="2">2 Overs</option><option value="5" selected>5 Overs</option></select>
                </div>
                <div><label class="text-xs font-black text-slate-400 uppercase">Wickets</label>
                    <select id="m-wickets" class="input-glass w-full p-3 rounded-lg font-bold"><option value="5">5</option><option value="10" selected>10</option></select>
                </div>
            </div>
            <button onclick="hostMatch()" class="w-full bg-blue-600 py-4 rounded-xl font-black text-lg mt-6 uppercase">Generate Room</button>
        </div>
    </div>

    <!-- 5. LOBBY -->
    <div id="lobby" class="screen p-4 max-w-5xl mx-auto w-full pt-8">
        <div class="glass p-8 rounded-[2rem] text-center border-t-2 border-emerald-500 mb-6 bg-black/80">
            <p class="text-emerald-400 font-black uppercase text-sm mb-2">Share Room Code</p>
            <div class="text-5xl md:text-7xl font-mono font-black text-white bg-black/60 p-4 rounded-2xl inline-block tracking-widest border border-emerald-500/30" id="lobby-code">----</div>
            <p id="lobby-status" class="text-yellow-400 font-bold mt-4 uppercase animate-pulse">Waiting for opponent to join...</p>
        </div>
    </div>

    <!-- 6. TOSS -->
    <div id="toss" class="screen p-4 max-w-lg mx-auto w-full items-center justify-center">
        <div class="glass p-12 rounded-[3rem] text-center w-full shadow-[0_0_50px_rgba(255,215,0,0.15)] border-t border-[#ffd700]">
            <h2 class="text-4xl font-black uppercase text-white mb-6">The Toss</h2>
            <p id="toss-text" class="text-[#ffd700] font-bold text-lg mb-8">Host is tossing...</p>
            <div id="toss-btns" style="display: none;" class="justify-center gap-6 flex">
                <button onclick="submitToss('bat')" class="bg-blue-600 p-8 rounded-3xl w-32 h-32 font-black text-2xl text-white shadow-lg border border-blue-400">BAT</button>
                <button onclick="submitToss('bowl')" class="bg-red-600 p-8 rounded-3xl w-32 h-32 font-black text-2xl text-white shadow-lg border border-red-400">BOWL</button>
            </div>
        </div>
    </div>

    <!-- 7. PRO BROADCAST ARENA -->
    <div id="arena" class="screen p-2 max-w-5xl mx-auto w-full pt-4 h-full">
        <div class="glass border-b-4 border-[#ffd700] rounded-t-2xl p-4 sm:p-6 mb-3 flex justify-between items-center bg-black">
            <div class="w-1/3 text-left">
                <div class="text-[10px] sm:text-xs text-slate-400 font-bold uppercase tracking-widest mb-1" id="ui-bat-team">BAT TEAM</div>
                <div class="text-4xl sm:text-6xl font-black text-white truncate" id="ui-score">0<span class="text-xl sm:text-4xl text-slate-400">/0</span></div>
            </div>
            <div class="w-1/3 text-center px-1">
                <div class="text-black font-black text-[10px] sm:text-xs uppercase bg-[#ffd700] px-3 py-1 rounded mb-2 inline-block">Innings <span id="ui-inn">1</span></div>
                <div class="text-base sm:text-xl font-black text-white uppercase tracking-widest">OVERS: <span id="ui-overs" class="text-blue-400">0.0</span></div>
            </div>
            <div class="w-1/3 text-right">
                <div class="text-[10px] sm:text-xs text-slate-400 font-bold uppercase tracking-widest mb-1" id="ui-bowl-team">BOWL TEAM</div>
                <div class="text-[10px] sm:text-xs font-black text-slate-400 uppercase mt-2">Target: <span class="text-[#ffd700] text-xl sm:text-3xl" id="ui-target">--</span></div>
            </div>
        </div>

        <div id="action-msg" class="w-full text-center py-2 font-black text-[#ffd700] uppercase text-xs sm:text-sm tracking-widest bg-black/50 rounded-lg mb-2 shadow-inner border border-[#ffd700]/20">Make Your Move</div>

        <div class="glass p-3 sm:p-5 rounded-b-2xl border-t border-slate-700 mt-auto bg-[#050b14]/90">
            <div class="grid grid-cols-4 md:grid-cols-7 gap-2 sm:gap-3">
                <button onclick="sendMove(0)" class="btn-move bg-[#0a1128] text-slate-400 rounded-xl py-5 sm:py-6 text-2xl font-black border-2 border-slate-700 hover:border-[#ffd700] hover:text-white">0</button>
                <button onclick="sendMove(1)" class="btn-move bg-[#0a1128] text-white rounded-xl py-5 sm:py-6 text-2xl font-black border-2 border-slate-700 hover:border-blue-400">1</button>
                <button onclick="sendMove(2)" class="btn-move bg-[#0a1128] text-white rounded-xl py-5 sm:py-6 text-2xl font-black border-2 border-slate-700 hover:border-blue-400">2</button>
                <button onclick="sendMove(3)" class="btn-move bg-[#0a1128] text-white rounded-xl py-5 sm:py-6 text-2xl font-black border-2 border-slate-700 hover:border-blue-400">3</button>
                <button onclick="sendMove(4)" class="btn-move bg-[#0a1128] text-emerald-400 rounded-xl py-5 sm:py-6 text-2xl font-black border-2 border-emerald-700 hover:border-emerald-400">4</button>
                <button onclick="sendMove(5)" class="btn-move bg-[#0a1128] text-white rounded-xl py-5 sm:py-6 text-2xl font-black border-2 border-slate-700 hover:border-blue-400">5</button>
                <button onclick="sendMove(6)" class="btn-move bg-[#0a1128] text-purple-400 rounded-xl py-5 sm:py-6 text-2xl font-black border-2 border-purple-700 hover:border-purple-400 col-span-2 md:col-span-1">6</button>
            </div>
        </div>
    </div>

    <!-- MODAL: BOWLER SELECTION -->
    <div id="bowler-modal" style="display: none;" class="fixed inset-0 bg-black/95 backdrop-blur-lg items-center justify-center p-4 flex-col">
        <div class="glass p-6 rounded-[2rem] w-full max-w-md border-t-4 border-red-500 text-center shadow-[0_0_50px_rgba(220,38,38,0.4)]">
            <h3 class="text-3xl font-black uppercase text-white mb-2 tracking-widest">Select Bowler</h3>
            <p class="text-xs text-red-400 mb-6 uppercase font-bold tracking-widest">Fielding Team Choice</p>
            <div id="bowler-list" class="space-y-3 max-h-72 overflow-y-auto pr-2 custom-scrollbar"></div>
        </div>
    </div>

    <script>
        const fc = { apiKey: "AIzaSyAofevQrPWUKWxWAkBLtXl4f_lH5FjjPZE", authDomain: "hand-cricket-c2d70.firebaseapp.com", databaseURL: "https://hand-cricket-c2d70-default-rtdb.firebaseio.com", projectId: "hand-cricket-c2d70" };
        firebase.initializeApp(fc); const auth = firebase.auth(); const db = firebase.database();
        
        let u=null, mRole=null, mId=null, mType=null; 
        let squadData = { name: "Team", p: [] };

        const pInp = document.getElementById('player-inputs');
        for(let i=1; i<=11; i++) {
            pInp.innerHTML += `<div class="flex items-center bg-black/50 border border-white/10 rounded-lg"><div class="bg-white/10 px-3 py-3 font-mono text-xs font-black text-white/50 w-10 text-center border-r border-white/10">${i}</div><input type="text" id="sq-${i}" placeholder="Player Name" class="w-full bg-transparent text-white px-3 py-3 text-sm outline-none font-bold uppercase"></div>`;
        }

        const screens = ['login', 'dashboard', 'match-config', 'lobby', 'toss', 'arena', 'squad-builder'];
        function nav(id) { screens.forEach(s => { let el = document.getElementById(s); if(el) el.classList.remove('active-screen'); }); document.getElementById(id).classList.add('active-screen'); }
        
        function login() { auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }
        
        auth.onAuthStateChanged(user => { 
            if(user) { 
                u = user; document.getElementById('nav-user').innerText = u.displayName.split(" ")[0]; 
                nav('dashboard'); 
            } else { nav('login'); } 
        });

        function prepSetup(type) { mType = type; nav('squad-builder'); }
        
        function saveSquadAndProceed() {
            squadData.name = document.getElementById('team-name').value || "Team";
            squadData.p = [];
            for(let i=1; i<=11; i++) squadData.p.push(document.getElementById(`sq-${i}`).value.trim() || `Player ${i}`);
            
            if(mRole === 'join_prep') finishJoin();
            else if(mType === 'match') nav('match-config');
        }

        function hostMatch() {
            mId = Math.random().toString(36).substring(2,7).toUpperCase(); mRole = 'p1';
            let ov = parseInt(document.getElementById('m-overs').value); let wk = parseInt(document.getElementById('m-wickets').value);
            db.ref('matches/'+mId).set({
                type: 'match', status: 'waiting', set: { ov: ov, wk: wk }, p1: { uid: u.uid, name: u.displayName, team: squadData },
                state: { bat: null, scr: 0, wic: 0, bls: 0, bwIdx: 10, needBw: false, mov: { p1: null, p2: null } }
            }).then(() => { document.getElementById('lobby-code').innerText = mId; nav('lobby'); listenMatch(); });
        }

        function joinAction() {
            let code = document.getElementById('join-input').value.toUpperCase().trim();
            if(!code) return;
            db.ref('matches/'+code).once('value', s => {
                if(s.exists() && s.val().status === 'waiting') { mId = code; mRole = 'join_prep'; mType='match'; nav('squad-builder'); }
                else alert("Invalid Code");
            });
        }

        function finishJoin() {
            mRole = 'p2'; db.ref('matches/'+mId).update({ status: 'toss', p2: { uid: u.uid, name: u.displayName, team: squadData } }).then(()=> listenMatch());
        }

        // --- THE FIX: TOSS & BOWLER SELECTION FLOW ---
        window.submitToss = function(ch) {
            let bat = ch === 'bat' ? mRole : (mRole === 'p1'?'p2':'p1');
            db.ref('matches/'+mId).update({ 'state/bat': bat, 'state/needBw': true, 'status': 'playing' });
        }

        function listenMatch() {
            db.ref('matches/'+mId).on('value', snap => {
                let m = snap.val(); if(!m) return;
                
                if(m.status === 'toss') {
                    nav('toss');
                    let tossWin = m.tossWin || (Math.random() < 0.5 ? 'p1' : 'p2');
                    if(mRole === 'p1' && !m.tossWin) db.ref('matches/'+mId).update({tossWin: tossWin});
                    
                    if(mRole === tossWin) { 
                        document.getElementById('toss-text').innerText = "You won! Choose Bat/Bowl."; 
                        document.getElementById('toss-btns').style.display = 'flex'; 
                    } else { 
                        document.getElementById('toss-text').innerText = "Opponent deciding..."; 
                        document.getElementById('toss-btns').style.display = 'none'; 
                    }
                }
                
                if(m.status === 'playing') {
                    nav('arena');
                    
                    if(mRole === 'p1' && m.state.mov.p1 !== null && m.state.mov.p2 !== null) calcBall(m);
                    
                    // --- THE FIX: MODAL ALWAYS SHOWS FOR FIELDING TEAM ---
                    if(m.state.needBw && m.state.mov.p1 === null && m.state.mov.p2 === null) {
                        if(mRole !== m.state.bat) { 
                            showBowlerModal(m); 
                        } else { 
                            document.getElementById('bowler-modal').style.display = 'none'; 
                            document.getElementById('action-msg').innerText = "Fielding team selecting bowler..."; 
                        }
                    } else {
                        document.getElementById('bowler-modal').style.display = 'none'; 
                    }
                    
                    renderScore(m);
                }
            });
        }

        window.sendMove = function(v) {
            document.querySelectorAll('.btn-move').forEach(b => b.classList.remove('selected-move'));
            event.target.classList.add('selected-move');
            document.getElementById('action-msg').innerText = "WAITING FOR OPPONENT...";
            db.ref(`matches/${mId}/state/mov/${mRole}`).set(v);
        }

        function calcBall(m) {
            let s = m.state; let r1 = s.mov.p1; let r2 = s.mov.p2;
            let btM = s.bat === 'p1' ? r1 : r2; let bwM = s.bat === 'p2' ? r1 : r2;
            let res = ''; let out = false; let run = 0;

            if(btM === 0 && bwM === 0) { res = '0'; } 
            else if(btM === bwM) { out = true; res = 'W'; }
            else { run = btM; res = run; }

            s.bls++;
            if(out) s.wic++; else s.scr += run;
            
            if(s.bls % 6 === 0) s.needBw = true;

            s.mov = {p1:null, p2:null};
            db.ref(`matches/${mId}/state`).set(s);
        }

        function showBowlerModal(m) {
            let bwTeam = m.state.bat === 'p1' ? m.p2 : m.p1;
            let html = '';
            for(let i=0; i<11; i++) {
                let pName = bwTeam.team.p[i] || `Player ${i+1}`;
                html += `<button onclick="setBowler(${i})" class="w-full p-4 rounded-xl text-left border-2 border-slate-600 font-black text-white mb-2 bg-slate-800 hover:border-[#ffd700]">${pName}</button>`;
            }
            document.getElementById('bowler-list').innerHTML = html;
            document.getElementById('bowler-modal').style.display = 'flex';
        }
        window.setBowler = function(idx) { db.ref(`matches/${mId}/state`).update({ bwIdx: idx, needBw: false }); }

        function renderScore(m) {
            let s = m.state; let bRole = s.bat; let bwRole = bRole === 'p1' ? 'p2' : 'p1';
            let tBat = bRole === 'p1' ? m.p1 : m.p2; let tBw = bRole === 'p2' ? m.p1 : m.p2;
            
            document.getElementById('ui-bat-team').innerText = tBat.team.name + " (BAT)"; 
            document.getElementById('ui-bowl-team').innerText = tBw.team.name + " (BOWL)";
            document.getElementById('ui-score').innerHTML = `${s.scr}<span class="text-xl sm:text-4xl text-slate-400">/${s.wic}</span>`;
            document.getElementById('ui-overs').innerText = `${Math.floor(s.bls/6)}.${s.bls%6}`;

            if(s.mov[mRole] === null && !s.needBw) {
                document.querySelectorAll('.btn-move').forEach(b => b.classList.remove('selected-move'));
                document.getElementById('action-msg').innerText = "MAKE YOUR MOVE";
            }
        }
    </script>
</body>
</html>
